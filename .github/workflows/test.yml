name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        # Everything the suite actually imports: the api extra (conftest imports
        # sqlalchemy unconditionally), the rust extra (the reasoning API tests
        # assert 200s that need the compute library — resolved from PyPI via
        # --no-sources since CI has no sibling checkout), and both dev lists
        # (the dependency-group carries aiosqlite for the sqlite-backed
        # repository tests).
        run: uv sync --all-extras --dev --no-sources

      - name: Run linter
        run: uv run --no-sync ruff check .

      - name: Run type checker
        # Advisory until the typing pass lands: the codebase carries ~151
        # pre-existing mypy errors (untyped FastAPI decorators, missing
        # annotations), and a permanently red gate masks real test failures.
        run: uv run --no-sync mypy src/
        continue-on-error: true

      - name: Migrate and seed the database
        # The service container starts empty; the API tests query real tables.
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync python scripts/load_seed_data.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
        run: uv run --no-sync pytest --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
